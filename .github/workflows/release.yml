# Step two of two. Watches main for a manifest version that has no matching
# tag, then tags it and publishes the release.
#
# This never writes to a branch. The manifest bump arrives through the pull
# request that release-pr.yml opens, and a tag push is not governed by the
# branch ruleset, so releases need no bypass and main stays protected.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "custom_components/light_lifetime/manifest.json"
  # Available by hand in case a merge happened while Actions was down, or a
  # release needs re-cutting after a failure.
  workflow_dispatch:

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags are needed to tell whether this version was already released,
          # and history for the generated release notes.
          fetch-depth: 0

      # Keyed on "is there a tag for the manifest version" rather than on
      # diffing the commit, so a re-run after a partial failure picks up where
      # it left off instead of double-releasing or refusing.
      - name: Work out whether there is anything to release
        id: check
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/light_lifetime/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the release
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin "v$VERSION"

      - name: Publish the release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          url="$(gh release view "v$VERSION" --json url --jq .url)"
          echo "Released [v$VERSION]($url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to do
        if: steps.check.outputs.release != 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: echo "v$VERSION is already released." >> "$GITHUB_STEP_SUMMARY"
