# Light Lifetime dashboard.
# Every card is self-maintaining: bulbs are discovered from the entities
# themselves, so newly tracked lights appear without editing this file.
# Requires no custom cards. Paste into a dashboard in raw YAML mode.

type: sections
max_columns: 2
title: Bulb Lifetime
sections:
  - type: grid
    cards:
      - type: heading
        heading: Fleet
        heading_style: title

      - type: markdown
        content: |
          {%- set ns = namespace(h=0, d=0, n=0, oldest=0, on=0) -%}
          {%- for s in states.sensor
                | selectattr('entity_id', 'search', '_on_hours$')
                | selectattr('state', 'is_number') -%}
            {%- set base = s.entity_id[:-9] -%}
            {%- set ns.h = ns.h + s.state | float(0) -%}
            {%- set ns.n = ns.n + 1 -%}
            {%- set ns.d = ns.d + (states(base ~ '_dropouts') | int(0)) -%}
            {%- if s.attributes.get('currently_on') %}{% set ns.on = ns.on + 1 %}{% endif -%}
            {%- set a = states(base ~ '_age') -%}
            {%- if a | is_number and a | float(0) > ns.oldest %}{% set ns.oldest = a | float(0) %}{% endif -%}
          {%- endfor %}
          ## {{ ns.h | round(0) | int }} hours
          **{{ ns.n }}** bulbs tracked &nbsp;·&nbsp; **{{ ns.on }}** on now &nbsp;·&nbsp; **{{ ns.d }}** dropouts

          Average **{{ (ns.h / [ns.n, 1] | max) | round(1) }} h** per bulb.
          {% if ns.oldest > 0 %}Oldest tracked bulb: **{{ (ns.oldest / 24) | round(0) | int }} days**.{% endif %}

  - type: grid
    cards:
      - type: heading
        heading: Ranking
        heading_style: title
        icon: mdi:trophy-outline

      - type: markdown
        text_only: true
        content: |
          {%- set ns = namespace(rows=[]) -%}
          {%- for s in states.sensor
                | selectattr('entity_id', 'search', '_on_hours$')
                | selectattr('state', 'is_number') -%}
            {%- set base = s.entity_id[:-9] -%}
            {%- set ns.rows = ns.rows + [(
                 s.state | float(0),
                 s.name | replace(' On hours', ''),
                 states(base ~ '_dropouts') | int(0),
                 s.attributes.get('currently_on', false)
               )] -%}
          {%- endfor -%}
          {%- set rows = ns.rows | sort(reverse=true) -%}
          {%- set top = rows[0][0] if rows else 1 -%}
          {%- if top <= 0 %}{% set top = 1 %}{% endif %}
          | | Bulb | | Hours |
          |--:|---|---|--:|
          {% for h, name, drops, lit in rows -%}
          {%- set bar = (h / top * 10) | round(0) | int -%}
          {%- set rank = '🥇' if loop.index == 1 else '🥈' if loop.index == 2 else '🥉' if loop.index == 3 else loop.index | string -%}
          {%- set flags = ('💡 ' if lit else '') ~ name ~ (' ⚠️' if drops >= 10 else '') -%}
          | {{ rank }} | {{ flags }} | `{{ '█' * bar }}{{ '·' * (10 - bar) }}` | **{{ h | round(1) }}** |
          {% endfor %}

  - type: grid
    cards:
      - type: heading
        heading: Connection health
        heading_style: title
        icon: mdi:lan-disconnect

      - type: markdown
        content: |
          {%- set ns = namespace(rows=[]) -%}
          {%- for s in states.sensor
                | selectattr('entity_id', 'search', '_dropouts$')
                | selectattr('state', 'is_number') -%}
            {%- if s.state | int(0) > 0 -%}
              {%- set ns.rows = ns.rows + [(
                   s.state | int(0),
                   s.name | replace(' Dropouts', '')
                 )] -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set rows = ns.rows | sort(reverse=true) -%}
          {% if rows | count == 0 %}
          No dropouts recorded. Every tracked bulb has stayed reachable.
          {% else %}
          | Bulb | Dropouts | |
          |---|--:|---|
          {% for n, name in rows -%}
          | {{ name }} | **{{ n }}** | {{ '🔴 investigate' if n >= 10 else '🟠 watch' if n >= 4 else '🟡' }} |
          {% endfor %}

          {% set worst = rows[0] %}
          {% if worst[0] >= 10 %}
          **{{ worst[1] }}** accounts for
          {{ (100 * worst[0] / (rows | map(attribute=0) | sum)) | round(0) | int }}%
          of all dropouts — worth checking its mesh position or power.
          {% endif %}
          {% endif %}

  - type: grid
    cards:
      - type: heading
        heading: Accumulation
        heading_style: title
        icon: mdi:chart-line

      # Long-term statistics are never purged, so this keeps growing forever.
      - type: statistic
        entity: sensor.bedroom_bed_right_on_hours
        stat_type: max
        period:
          calendar:
            period: month
        name: Bed Right this month
