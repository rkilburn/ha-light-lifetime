# Light Lifetime dashboard.
# Every card is self-maintaining: bulbs are discovered from the entities
# themselves, so newly tracked lights appear without editing this file.
# Requires no custom cards. Paste into a dashboard in raw YAML mode.

views:
  - title: Bulb Lifetime
    path: bulb-lifetime
    icon: mdi:lightbulb-on-outline
    type: sections
    max_columns: 2
    badges:
      - type: entity
        entity: sensor.lights_total_hours
        name: Total hours
        color: amber
      - type: entity
        entity: sensor.lights_on
        name: On now
        color: yellow
      - type: entity
        entity: sensor.lights_tracked
        name: Tracked
      - type: entity
        entity: sensor.lights_total_dropouts
        name: Dropouts
        color: red
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Ranking
            heading_style: title
            icon: mdi:trophy-outline

          - type: markdown
            text_only: true
            content: |
              {%- set ns = namespace(rows=[]) -%}
              {%- for s in states.sensor
                    | selectattr('attributes.source_entity_id', 'defined')
                    | selectattr('entity_id', 'search', '_on_hours$')
                    | selectattr('state', 'is_number') -%}
                {%- set base = s.entity_id[:-9] -%}
                {%- set area = area_name(s.entity_id) -%}
                {%- set label = s.name | replace(' On hours', '') -%}
                {%- set ns.rows = ns.rows + [(
                     s.state | float(0),
                     (area ~ ' · ' ~ label) if area and area not in label else label,
                     states(base ~ '_dropouts') | int(0),
                     s.attributes.get('currently_on', false)
                   )] -%}
              {%- endfor -%}
              {%- set rows = ns.rows | sort(reverse=true) -%}
              {%- set top = rows[0][0] if rows else 1 -%}
              {%- if top <= 0 %}{% set top = 1 %}{% endif %}
              | | Bulb | | Hours |
              |:-:|---|---|:-:|
              {% for h, name, drops, lit in rows -%}
              {%- set bar = (h / top * 10) | round(0) | int -%}
              {%- set rank = '🥇' if loop.index == 1 else '🥈' if loop.index == 2 else '🥉' if loop.index == 3 else loop.index | string -%}
              {#- Every row carries an icon, so "off" reads as a state rather than an absence. -#}
              {%- set icon = 'mdi:lightbulb' if lit else 'mdi:lightbulb-outline' -%}
              {%- set tint = 'var(--state-light-active-color)' if lit else 'var(--disabled-text-color)' -%}
              {%- set mark = '<ha-icon icon="' ~ icon ~ '" style="color:' ~ tint ~ ';--mdc-icon-size:18px"></ha-icon>' -%}
              {%- set warn = '<ha-icon icon="mdi:alert" style="color:var(--error-color);--mdc-icon-size:16px"></ha-icon>' if drops >= 10 else '' -%}
              {%- set flags = mark ~ ' ' ~ name ~ ' ' ~ warn -%}
              | {{ rank }} | {{ flags }} | `{{ '█' * bar }}{{ '·' * (10 - bar) }}` | **{{ h | round(1) }}** |
              {% endfor %}

      - type: grid
        cards:
          - type: heading
            heading: Connection health
            heading_style: title
            icon: mdi:lan-disconnect

          - type: markdown
            text_only: true
            content: |
              {%- set ns = namespace(rows=[]) -%}
              {%- for s in states.sensor
                    | selectattr('attributes.source_entity_id', 'defined')
                    | selectattr('entity_id', 'search', '_dropouts$')
                    | selectattr('state', 'is_number') -%}
                {%- if s.state | int(0) > 0 -%}
                  {%- set area = area_name(s.entity_id) -%}
                  {%- set label = s.name | replace(' Dropouts', '') -%}
                  {%- set ns.rows = ns.rows + [(
                       s.state | int(0),
                       (area ~ ' · ' ~ label) if area and area not in label else label
                     )] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set rows = ns.rows | sort(reverse=true) -%}
              {% if rows | count == 0 %}
              No dropouts recorded. Every tracked bulb has stayed reachable.
              {% else %}
              | Bulb | Dropouts | |
              |---|--:|---|
              {% for n, name in rows -%}
              | {{ name }} | **{{ n }}** | {{ '🔴 investigate' if n >= 10 else '🟠 watch' if n >= 4 else '🟡' }} |
              {% endfor %}

              {%- set worst = rows[0] -%}
              {%- if worst[0] >= 10 %}
              **{{ worst[1] }}** accounts for {{ (100 * worst[0] / (rows | map(attribute=0) | sum)) | round(0) | int }}% of all dropouts — worth checking its mesh position or power.
              {% endif -%}
              {% endif %}

